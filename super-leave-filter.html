ion populate(){const s=$('staff'),old=s.value;s.innerHTML='<option value="">All staff</option>'+staffList().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>'<option value="'+esc(x.code)+'">'+esc(x.name)+' ('+esc(x.code)+')</option>').join('');if([...s.options].some(o=>o.value===old))s.value=old}function render(){const sv=$('staff').value,tv=$('type').value,q=$('q').value.trim().toLowerCase(),f=ROWS.filter(r=>(!sv||r.code===sv)&&(!tv||r.type===tv)&&(!q||(name(r.code)+' '+r.code+' '+label(r.p)+' '+r.note).toLowerCase().includes(q)));$('summary').innerHTML='Showing <b>'+f.length+'</b> of <b>'+ROWS.length+'</b> current/scheduled records.';$('rows').innerHTML=f.length?'<div class="tablewrap"><table><thead><tr><th>Staff</th><th>Status</th><th>Date / Range</th><th>Remarks</th><th>Action</th></tr></thead><tbody>'+f.map(r=>'<tr><td><b>'+esc(name(r.code))+'</b><div class="small">'+esc(r.code)+'</div></td><td><span class="pill">'+esc(label(r.p))+'</span></td><td>'+esc(r.from===r.to?fmt(r.from):fmt(r.from)+' → '+fmt(r.to))+'</td><td>'+esc(r.note||'—')+'</td><td><button data-end="'+esc(r.id)+'">End on date</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No matching record.</div>';$('rows').querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>endPlan(b.dataset.end))}async function load(){const[ms,ps]=await Promise.all([getDoc(doc(db,'master','current')),getDoc(doc(db,'dailyRecords','__leavePlans'))]);const raw=ms.exists()?ms.data():{};MASTER=raw.data||raw||{};PLANS=ps.exists()?(ps.data().plans||{}):{};build();populate();render()}async function endPlan(id){const p=PLANS[id];if(!p)return;const suggested=new Date().toLocaleDateString('en-GB');const entered=prompt('End this '+label(p)+' on which date? Use DD/MM/YYYY.',suggested);if(!entered)return;const m=entered.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return alert('Please use DD/MM/YYYY.');const iso=m[3]+'-'+m[2]+'-'+m[1];if(!confirm('End '+label(p)+' for '+name(String(p.code||p.teacherCode||''))+'
