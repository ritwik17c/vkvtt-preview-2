<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Revision History · VKVTT</title><style>:root{--ink:#17364f;--muted:#617685;--line:#cbdce5;--bg:#edf6f1;--deep:#236d99;--warn:#fff7df;--bad:#fdecec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{background:#1d638e;color:white;padding:16px}.wrap{max-width:980px;margin:auto;padding:0 15px}.head,.actions{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{font:inherit;font-weight:780;border:1px solid #bdd2dd;border-radius:10px;padding:9px 12px;background:#e7f2f7;color:var(--ink);text-decoration:none;cursor:pointer}.primary{background:var(--deep);color:white}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:15px 0}.tip,.warn,.error{padding:10px 12px;border-radius:10px;margin:9px 0}.tip{background:#eef7fb;border:1px solid #c6dce7}.warn{background:var(--warn);border:1px solid #e5cd8c}.error{background:var(--bad);border:1px solid #efb9b9}.meta{font-size:.82rem;color:var(--muted);margin:5px 0}.event{border-left:3px solid #cbdce5;margin:9px 0 0 7px;padding:0 0 1px 13px}.event>div{margin:0 0 12px}.hide{display:none!important}</style></head><body><header><div class="wrap head"><div><h1 style="margin:0;font-size:1.4rem">🕘 My Question Revision History</h1><div style="opacity:.9;font-size:.86rem">Returns, corrections, resubmissions and verification trail</div></div><div class="actions"><a class="btn" href="qb-teacher-hub.html">← Question Bank</a><a class="btn" href="./">Home</a></div></div></header><main class="wrap"><section id="gate" class="card"><b>Checking your VKVTT identity…</b><div id="gateMsg"></div></section><section id="app" class="hide"><div class="card"><div class="tip">This is a read-only view of your own Question Bank workflow. It does not change questions, statuses or coordinator decisions.</div><button id="load" class="primary">Load My Revision History</button><div id="msg"></div></div><div id="list"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,getDoc,collection,getDocs,query,where,limit}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserLocalPersistence).catch(()=>{});const $=id=>document.getElementById(id),mail=v=>String(v||'').trim().toLowerCase(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let u=null;function fmt(v){if(!v)return'—';const d=v?.toDate?v.toDate():new Date(typeof v==='number'?v:Date.parse(v));return isNaN(d)?'—':d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function label(a){return String(a||'workflow event').replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase())}function owner(q){return(q.teacherUid&&String(q.teacherUid)===u.uid)||(q.teacherEmail&&mail(q.teacherEmail)===mail(u.email))}function card(q){const events=Array.isArray(q.workflow)?q.workflow:[],notes=[q.returnNote,q.returnReason,q.returnedReason,q.coordinatorNote,q.suggestion].filter(Boolean);return`<section class="card"><b>${esc(q.questionText||'(Question text unavailable)')}</b><div class="meta">${esc(q.status||'')} · ${esc(q.className||'')} · ${esc(q.subject||'')} · ${esc(q.marks??'')} mark(s)</div>${notes.length?`<div class="warn"><b>Latest correction note:</b> ${esc(notes[0])}</div>`:''}<div class="event">${events.length?events.map((e,i)=>{const n=e.reason||e.note||e.returnNote||e.suggestion||'';return`<div><b>${i+1}. ${esc(label(e.action))}</b><div class="meta">${esc(fmt(e.atMs||e.at||e.timestamp))}${e.byName?' · '+esc(e.byName):''}</div>${n?`<div class="warn"><b>Note:</b> ${esc(n)}</div>`:''}</div>`}).join(''):'<div class="meta">No detailed workflow events were recorded for this older question.</div>'}</div></section>`}async function load(){const msg=$('msg'),map=new Map();msg.innerHTML='<div class="tip">Loading your question history…</div>';const a=await getDocs(query(collection(db,'qbQuestions'),where('teacherUid','==',u.uid),limit(100))).catch(()=>null);a?.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));if(u.email){const b=await getDocs(query(collection(db,'qbQuestions'),where('teacherEmail','==',mail(u.email)),limit(100))).catch(()=>null);b?.forEach(d=>map.set(d.id,{id:d.id,...d.data()}))}const rows=[...map.values()].filter(owner).filter(q=>Array.isArray(q.workflow)&&q.workflow.length||String(q.status||'').toLowerCase()==='returned').sort((a,b)=>Number(b.updatedAtMs||b.createdAtMs||0)-Number(a.updatedAtMs||a.createdAtMs||0));msg.innerHTML='<div class="tip">Loaded '+rows.length+' question(s) with revision/workflow history.</div>';$('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="card">No revision history found yet.</div>'}async function boot(){u=auth.currentUser;if(!u)throw Error('Return to VKVTT Home and sign in first.');const [a,v]=await Promise.all([getDoc(doc(db,'authorizedUsers',u.uid)).catch(()=>null),u.email?getDoc(doc(db,'viewerEmails',mail(u.email))).catch(()=>null):null]);const profile=a?.exists()&&a.data().active!==false?a.data():v?.exists()&&v.data().active!==false?v.data():null;if(!profile)throw Error('This account is not authorised in VKVTT.');$('gate').classList.add('hide');$('app').classList.remove('hide')}$('load').onclick=load;boot().catch(e=>$('gateMsg').innerHTML='<div class="error">'+esc(e.message||e)+'</div>');</script></body></html>
