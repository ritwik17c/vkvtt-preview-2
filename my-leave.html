h></tr></thead><tbody>${rows.map(r=>`<tr class="${r.type==='full'?'full':r.type==='half'?'half':''}"><td>${esc(r.type==='full'?'Full Leave':r.type==='half'?'Half Leave':'On Duty (OD)')}</td><td>${esc(r.cat||'—')}</td><td>${r.type==='od'?'—':esc(r.units||'—')}</td><td>${esc(r.from===r.to?fmt(r.from):fmt(r.from)+' → '+fmt(r.to))}</td><td>${r.type==='half'?'Half day':r.type==='full'?'Full day':'Duty'}</td><td>${esc(r.note||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="status">No record in this category.</div>'}try{const u=auth.currentUser;if(!u)throw Error('Please sign in from Timetable Home first.');const email=String(u.email||'').trim().toLowerCase();if(!email)throw Error('Your Google account email could not be resolved.');const ctl=await getDoc(doc(db,'leaveControl','current')).catch(()=>null);if(ctl?.exists()&&ctl.data().myAreaLeaveHistoryVisible===false)throw Error('Personal leave history is currently disabled by the Principal.');const s=await getDocs(collection(db,'personalStatus',email,'records'));const raw=[];s.forEach(d=>{const x=d.data()||{},t=type(x);if(!['full','half','od'].includes(t)||x.active===false)return;raw.push({type:t,cat:String(x.leaveCategory||x.category||'').toUpperCase(),date:dateOf(d.id,x),units:Number(x.leaveUnits||x.units||(t==='half'?.5:t==='full'?1:0)),note:x.note||x.remarks||''})});const leave=merge(raw.filter(r=>r.type!=='od')),duty=merge(raw.filter(r=>r.type==='od'));$('summary').innerHTML=`Signed in as <b>${esc(email)}</b> · <b>${leave.length}</b> consolidated leave range(s) · <b>${duty.length}</b> duty range(s).`;$('leave').innerHTML=table(leave);$('duty').innerHTML=table(duty);$('gate').className='status ok';$('gate').textContent='Your personal leave/duty history is ready.';$('app').hidden=false}catch(e){$('gate').className='status warn';$('gate').textContent=e.message||e}</script></body></html>
