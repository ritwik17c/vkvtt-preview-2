rCase(),norm=v=>String(v??'').trim().toLowerCase().replace(/[\s_-]+/g,''),txt=v=>String(v||'').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let u,p,m,t,staff;function canonical(c){const a=m.teacherCodeAliases||{},seen=new Set();c=txt(c);while(c&&a[c]&&!seen.has(c)){seen.add(c);c=txt(a[c])}return c}function arrays(){return{directory:(m.staffDirectory||[]).filter(Boolean),teachers:(m.teachers||[]).filter(Boolean),non:(m.nonTeachingStaff||[]).filter(Boolean)}}function allStaff(){const a=arrays();return[...a.directory,...a.teachers,...a.non]}function ids(x){return[x?.id,x?.recordId,x?.staffRecordId,x?.code,x?.shortCode,x?.teacherShortCode,x?.timetableCode,x?.employeeCode].map(txt).filter(Boolean)}function emails(x){return[x?.email,x?.gmail,x?.googleEmail,x?.google_email,x?.officialEmail,x?.loginEmail,...(Array.isArray(x?.emails)?x.emails:[])].map(mail).filter(Boolean)}function findStaff(profile){const rid=txt(profile.staffRecordId||profile.recordId||'');if(rid){const hit=allStaff().find(x=>ids(x).includes(rid)||('teacher:'+txt(x.code))===rid||('nt:'+txt(x.code))===rid);if(hit)return hit}const e=mail(u?.email);if(e){const hit=allStaff().find(x=>emails(x).includes(e));if(hit)return hit}const wanted=new Set([profile.teacherCode,profile.teacherShortCode,profile.timetableCode,profile.staffCode,profile.code,profile.employeeCode].map(txt).filter(Boolean));return allStaff().find(x=>ids(x).some(v=>wanted.has(v)))||null}function teacherByCode(c){c=canonical(c);return arrays().teachers.find(x=>canonical(x.code||x.shortCode||x.teacherShortCode||x.timetableCode)===c)||null}function teacherCodeFromEmail(){const e=mail(u?.email);for(const[c,v]of Object.entries(m.teacherEmailMap||{}))if(mail(v)===e&&teacherByCode(c))return canonical(c);const hit=arrays().teachers.find(x=>emails(x).includes(e));return hit?canonical(hit.code||hit.shortCode||hit.teacherShortCode||hit.timetableCode):''}function resolveTeacher(){staff=f
