<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>VKVTT Production · Printable Timetables</title><style>
:root{--ink:#17364f;--muted:#617685;--line:#cbdce5;--bg:#edf6f1;--deep:#236d99}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}header{background:#1d638e;color:#fff;padding:16px}.wrap{max-width:1220px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:1.38rem;margin:0}.sub{font-size:.88rem;opacity:.9}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{font:inherit;font-weight:750;border:1px solid #b9ced9;border-radius:10px;padding:9px 12px;background:#e7f2f7;color:var(--ink);cursor:pointer;text-decoration:none}.primary{background:var(--deep);color:#fff;border-color:var(--deep)}main{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.status{padding:10px 12px;background:#eef7fb;border-radius:11px}.error{background:#fdecec;color:#8b2d2d}.ok{background:#e7f6ea;color:#245c34}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;align-items:end}label{display:block;color:var(--muted);font-size:.8rem;margin-bottom:4px}select{width:100%;padding:10px;border:1px solid #c7d5de;border-radius:9px;background:#fff;font:inherit}.previewShell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;overflow:auto}.printDoc{background:#fff;color:#111}.schoolHead{text-align:center;margin-bottom:7px}.schoolHead h2{font-size:17px;margin:0}.schoolHead .meta{font-size:10px;margin-top:2px}.page{page-break-after:always;margin-bottom:16px}.page:last-child{page-break-after:auto}.pageTitle{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:5px 0 6px}.pageTitle h3{font-size:13px;margin:0}.pageTitle span{font-size:9px;color:#444}.tt{border-collapse:collapse;width:100%;table-layout:fixed}.tt th,.tt td{border:1px solid #5d6770;padding:3px;text-align:center;vertical-align:middle;font-size:8.2px;line-height:1.2;word-break:break-word}.tt th{background:#eef2f4;font-weight:700}.tt .stub{width:68px;font-weight:700}.periodHead{font-size:8px}.periodTime{font-weight:400;font-size:6.8px;display:block;margin-top:1px}.cellSubject{font-weight:700}.cellTeacher{font-size:7.2px;margin-top:2px}.cellVenue{font-size:6.8px;color:#555;margin-top:1px}.emptyCell{color:#999}.signature{display:flex;justify-content:flex-end;margin-top:13px;font-size:9px}.signature div{text-align:center;min-width:130px;border-top:1px solid #555;padding-top:3px;margin-top:18px}.legend{font-size:7.5px;margin-top:5px;color:#444}.dayList{border-collapse:collapse;width:100%}.dayList th,.dayList td{border:1px solid #68737b;padding:5px;font-size:9px;text-align:left}.dayList th{background:#eef2f4}.screenHint{font-size:.84rem;color:var(--muted);margin-top:8px}@media(max-width:760px){.controls{grid-template-columns:1fr}.previewShell{padding:5px}.tt th,.tt td{font-size:7px;padding:2px}}@page{size:A4 landscape;margin:8mm}@media print{body{background:#fff}.screenOnly,header{display:none!important}main{padding:0}.previewShell{border:0;padding:0;overflow:visible}.printDoc{width:100%}.page{margin:0}.schoolHead h2{font-size:15px}.tt th,.tt td{font-size:7.4px;padding:2.5px}.dayList th,.dayList td{font-size:8px;padding:4px}.periodTime{font-size:6.2px}.cellTeacher{font-size:6.7px}.cellVenue{font-size:6.2px}}
</style></head><body><header><div class="wrap head"><div><h1>Printable Master Timetables</h1><div class="sub">VKV Nalbari · Class-wise, Teacher-wise and Day-wise</div></div><div class="actions"><a class="btn" href="./">🏠 Timetable Home</a><a class="btn" href="./admin-dashboard.html">← Admin Dashboard</a></div></div></header><main class="wrap"><section id="gate" class="card screenOnly"><div id="gateMsg" class="status">Checking Admin access…</div><button id="signInBtn" style="display:none">Sign in with Google</button></section><div id="app" style="display:none"><section class="card screenOnly"><div class="controls"><div><label>Printable template</label><select id="template"><option value="class">Class-wise · one class/section per page</option><option value="teacher">Teacher-wise · one teacher per page</option><option value="day">Day-wise · one day per page</option></select></div><div><label>Schedule profile</label><select id="profile"></select></div><div><label>Teacher display</label><select id="teacherMode"><option value="code">Short code</option><option value="name">Full name</option><option value="both">Name + code</option></select></div><div class="actions"><button id="printBtn" class="primary">🖨 Print / PDF</button><button id="copyBtn">📋 Copy</button><button id="shareBtn">↗ Share</button></div></div><div id="hint" class="screenHint"></div><div id="actionMsg" class="status" style="display:none"></div></section><div class="previewShell"><div id="doc" class="printDoc"></div></div></div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-lite.js';
const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'},fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);await setPersistence(auth,browserLocalPersistence).catch(()=>{});if(auth.authStateReady)await auth.authStateReady().catch(()=>{});
let masterDoc={},master={};const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('signInBtn').onclick=()=>signInWithPopup(auth,provider);$('printBtn').onclick=()=>window.print();
onAuthStateChanged(auth,async u=>{if(!u){$('gateMsg').textContent='Sign in with the Admin Google account.';$('signInBtn').style.display='inline-block';return}$('signInBtn').style.display='none';try{const p=await getDoc(doc(db,'authorizedUsers',u.uid));if(!p.exists()||p.data().active!==true||p.data().role!=='admin')throw Error('Admin access is required.');const m=await getDoc(doc(db,'master','current'));if(!m.exists())throw Error('Master timetable not found.');masterDoc=m.data()||{};master=structuredClone(masterDoc.data||masterDoc);$('gateMsg').className='status ok';$('gateMsg').textContent='Admin verified.';$('app').style.display='block';init()}catch(e){$('gateMsg').className='status error';$('gateMsg').textContent=e.message||e}});
function profiles(){const x=master.scheduleProfiles||{};if(!x.normal)x.normal={id:'normal',name:'Normal Schedule',times:{...(master.times||{})},classPeriods:{...(master.patterns||{})}};return x}function init(){const ps=Object.values(profiles());$('profile').innerHTML=ps.map(p=>`<option value="${safe(p.id||'normal')}">${safe(p.name||p.id||'Schedule')}${String(p.id)===String(master.activeScheduleProfileId||'normal')?' · ACTIVE':''}</option>`).join('');$('profile').value=master.activeScheduleProfileId||'normal';['profile','teacherMode','template'].forEach(id=>$(id).onchange=render);$('copyBtn').onclick=copyCurrent;$('shareBtn').onclick=shareCurrent;render()}
function selected(){return profiles()[$('profile').value]||profiles().normal}function periods(){const set=new Set();Object.keys(selected()?.times||{}).forEach(x=>set.add(Number(x)));Object.values(selected()?.classPeriods||{}).flat().forEach(x=>set.add(Number(x)));(master.records||[]).forEach(r=>set.add(Number(r.period)));return[...set].filter(Boolean).sort((a,b)=>a-b)}function activeFor(cls,p){const cp=selected()?.classPeriods;if(cp&&Array.isArray(cp[cls]))return cp[cls].map(Number).includes(Number(p));const pat=master.patterns?.[cls];return Array.isArray(pat)?pat.map(Number).includes(Number(p)):true}function timeFor(p){return selected()?.times?.[String(p)]??master.times?.[String(p)]??''}function codes(r){if(Array.isArray(r.codes)&&r.codes.length)return r.codes.filter(Boolean);const e=String(r.entry||'');return(master.teachers||[]).map(t=>String(t.code||'')).filter(c=>c&&new RegExp('(^|[^A-Za-z0-9])'+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^A-Za-z0-9])').test(e))}function teacher(c){return(master.teachers||[]).find(t=>String(t.code)===String(c))}function subject(r){let s=String(r.subject||r.subjectName||r.assignment||r.entry||'').trim();for(const c of codes(r))s=s.replace(new RegExp('(^|[-/ ,&])'+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[-/ ,&])','g'),'$1');return s.replace(/[\s\-\/,&]+$/g,'').trim()||String(r.entry||'').trim()}function venue(r){return String(r.venue||r.room||r.classroom||'').trim()}function teacherText(r){const cs=codes(r),mode=$('teacherMode').value;return cs.map(c=>{const n=teacher(c)?.name||c;return mode==='name'?n:mode==='both'?`${n} (${c})`:c}).join(' / ')}function meta(){return`Master Timetable · Session ${safe(masterDoc.session||master.session||'2026-27')} · ${safe(selected()?.name||'Schedule')}`}function head(){return`<div class="schoolHead"><h2>Vivekananda Kendra Vidyalaya, Nalbari</h2><div class="meta">${meta()}</div></div>`}function signature(){return'<div class="signature"><div>Principal</div></div>'}
function classCell(cls,day,p){if(!activeFor(cls,p))return'<td class="emptyCell">—</td>';const rs=(master.records||[]).filter(r=>String(r.class)===String(cls)&&String(r.day)===day&&Number(r.period)===Number(p));if(!rs.length)return'<td></td>';return'<td>'+rs.map(r=>`<div class="cellSubject">${safe(subject(r))}</div><div class="cellTeacher">${safe(teacherText(r))}</div>${venue(r)?`<div class="cellVenue">${safe(venue(r))}</div>`:''}`).join('<hr style="border:0;border-top:1px dotted #999;margin:2px 0">')+'</td>'}
function teacherCell(code,day,p){const rs=(master.records||[]).filter(r=>String(r.day)===day&&Number(r.period)===Number(p)&&codes(r).map(String).includes(String(code)));if(!rs.length)return'<td></td>';return'<td>'+rs.map(r=>`<div class="cellSubject">${safe(r.class||'')}</div><div>${safe(subject(r))}</div>${venue(r)?`<div class="cellVenue">${safe(venue(r))}</div>`:''}`).join('<hr style="border:0;border-top:1px dotted #999;margin:2px 0">')+'</td>'}
function renderClass(){const ps=periods(),classes=[...(master.classes||[])];return classes.map(cls=>`<section class="page">${head()}<div class="pageTitle"><h3>Class / Section: ${safe(cls)}</h3><span>${safe(master.activeTimetableVersionName||'Current Master')}</span></div><table class="tt"><thead><tr><th class="stub">Day</th>${ps.map(p=>`<th><span class="periodHead">P${p}</span>${timeFor(p)?`<span class="periodTime">${safe(timeFor(p))}</span>`:''}</th>`).join('')}</tr></thead><tbody>${DAYS.map(d=>`<tr><th class="stub">${d}</th>${ps.map(p=>classCell(cls,d,p)).join('')}</tr>`).join('')}</tbody></table><div class="legend">Class-wise timetable · Subject / Assignment · Teacher · Venue when specified</div>${signature()}</section>`).join('')}
function renderTeacher(){const ps=periods(),used=new Set((master.records||[]).flatMap(r=>codes(r).map(String))),teachers=(master.teachers||[]).filter(t=>used.has(String(t.code))).sort((a,b)=>String(a.name||a.code).localeCompare(String(b.name||b.code)));return teachers.map(t=>`<section class="page">${head()}<div class="pageTitle"><h3>Teacher: ${safe(t.name||t.code)} (${safe(t.code)})</h3><span>${safe(master.activeTimetableVersionName||'Current Master')}</span></div><table class="tt"><thead><tr><th class="stub">Day</th>${ps.map(p=>`<th><span class="periodHead">P${p}</span>${timeFor(p)?`<span class="periodTime">${safe(timeFor(p))}</span>`:''}</th>`).join('')}</tr></thead><tbody>${DAYS.map(d=>`<tr><th class="stub">${d}</th>${ps.map(p=>teacherCell(t.code,d,p)).join('')}</tr>`).join('')}</tbody></table><div class="legend">Teacher-wise timetable · Class / Section · Subject / Assignment · Venue when specified</div>${signature()}</section>`).join('')}
function renderDay(){const ps=periods();return DAYS.map(day=>{const rows=[];for(const p of ps){const rs=(master.records||[]).filter(r=>String(r.day)===day&&Number(r.period)===p).sort((a,b)=>String(a.class).localeCompare(String(b.class)));for(const r of rs)rows.push(`<tr><td><b>P${p}</b>${timeFor(p)?`<div>${safe(timeFor(p))}</div>`:''}</td><td>${safe(r.class||'')}</td><td>${safe(subject(r))}</td><td>${safe(teacherText(r))}</td><td>${safe(venue(r))}</td></tr>`)}return`<section class="page">${head()}<div class="pageTitle"><h3>${safe(day)} · Day-wise Timetable</h3><span>${safe(master.activeTimetableVersionName||'Current Master')}</span></div><table class="dayList"><thead><tr><th>Period / Time</th><th>Class / Section</th><th>Subject / Assignment</th><th>Teacher</th><th>Venue</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="5">No timetable entries.</td></tr>'}</tbody></table>${signature()}</section>`}).join('')}
function render(){const t=$('template').value;$('hint').textContent=t==='class'?'Class-wise: one class/section per A4 landscape page.':t==='teacher'?'Teacher-wise: one current timetable teacher per A4 landscape page.':'Day-wise: one day per page in period/class sequence.';$('doc').innerHTML=t==='teacher'?renderTeacher():t==='day'?renderDay():renderClass()}
function plainText(){const t=$('template').value,ps=periods(),lines=['Vivekananda Kendra Vidyalaya, Nalbari',`Master Timetable · Session ${masterDoc.session||master.session||'2026-27'} · ${selected()?.name||'Schedule'}`,''];if(t==='class'){for(const cls of master.classes||[]){lines.push(`CLASS / SECTION: ${cls}`);for(const d of DAYS)for(const p of ps){const rs=(master.records||[]).filter(r=>String(r.class)===String(cls)&&String(r.day)===d&&Number(r.period)===p);for(const r of rs)lines.push(`${d} P${p}${timeFor(p)?' '+timeFor(p):''} | ${subject(r)} | ${teacherText(r)}${venue(r)?' | '+venue(r):''}`)}lines.push('')}}else if(t==='teacher'){const used=new Set((master.records||[]).flatMap(r=>codes(r).map(String)));for(const x of (master.teachers||[]).filter(q=>used.has(String(q.code)))){lines.push(`TEACHER: ${x.name||x.code} (${x.code})`);for(const d of DAYS)for(const p of ps){const rs=(master.records||[]).filter(r=>String(r.day)===d&&Number(r.period)===p&&codes(r).includes(x.code));for(const r of rs)lines.push(`${d} P${p}${timeFor(p)?' '+timeFor(p):''} | ${r.class} | ${subject(r)}${venue(r)?' | '+venue(r):''}`)}lines.push('')}}else{for(const d of DAYS){lines.push(`DAY: ${d}`);for(const p of ps)for(const r of (master.records||[]).filter(x=>String(x.day)===d&&Number(x.period)===p))lines.push(`P${p}${timeFor(p)?' '+timeFor(p):''} | ${r.class} | ${subject(r)} | ${teacherText(r)}${venue(r)?' | '+venue(r):''}`);lines.push('')}}return lines.join('\n')}
function showAction(s){$('actionMsg').style.display='block';$('actionMsg').className='status ok';$('actionMsg').textContent=s}async function copyCurrent(){try{await navigator.clipboard.writeText(plainText());showAction('Printable timetable copied to the clipboard.')}catch(e){showAction('Copy was blocked by the browser. Please use Print / PDF instead.')}}async function shareCurrent(){const text=plainText(),title='VKV Nalbari Master Timetable';try{if(navigator.share){await navigator.share({title,text});showAction('Share sheet opened.')}else{await navigator.clipboard.writeText(text);showAction('Sharing is not available in this browser; the timetable was copied instead.')}}catch(e){if(e?.name!=='AbortError')showAction('Share was not available. The timetable remains unchanged.')}}
</script></body></html>
