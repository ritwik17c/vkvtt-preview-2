ate requires Principal authorisation.'}catch(_){}}function cleanDPB(){try{const d=f.contentDocument;if(!d)return;d.querySelectorAll('select option').forEach(o=>{if(dpb((o.value||'')+' '+(o.textContent||''))){if(o.selected)o.parentElement.value='';o.remove()}});d.querySelectorAll('button,a').forEach(b=>{if(!/^allot$/i.test((b.textContent||'').trim()))return;let x=b.parentElement;for(let n=0;n<4&&x;n++,x=x.parentElement){const t=(x.textContent||'').trim();if(t.length<360&&dpb(t)){x.remove();break}}})}catch(_){}}function selectedDate(){try{const d=f.contentDocument,w=f.contentWindow,i=d.getElementById('proxyWorkDate');if(!i)return'';if(typeof w.inputDate==='function')return w.inputDate(i.value)||'';const q=String(i.value||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return q?`${q[3]}-${q[2]}-${q[1]}`:''}catch(_){return''}}function fixSummary(){try{const d=f.contentDocument,w=f.contentWindow,out=d.getElementById('proxyTodayStatusSummary');if(!out)return;const date=selectedDate(),today=typeof w.todayKey==='function'?w.todayKey():'';if(!date||!today)return;if(date===today){if(typeof w.renderTodayProxyStatusSummary==='function')w.renderTodayProxyStatusSummary();return}let rows=[];if(typeof w.leaveData==='function')rows=(w.leaveData(date)||[]).filter(o=>o&&['full','half','od','special','vacant'].includes(o.type));const label=typeof w.displayDate==='function'?w.displayDate(date):date;if(!rows.length){out.innerHTML='<b>Leave / Duty Leave / Operational Status for '+label+'</b><div class="small" style="margin-top:5px">Today’s leave and duty summary is not applied to this future proxy date. No approved or scheduled status record is available for this date.</div>';return}out.innerHTML='<b>Leave / Duty Leave / Operational Status for '+label+'</b><div class="small" style="margin:4px 0 8px">Only records applicable to this selected date affect availability.</div>'+rows.map(o=>{const t=typeof w.teacherByEffectiveCode==='function'?w.teacherByEffectiveCode(o.code,date):null,l=typeof w.statusLabel==='function'?w.statusLabel(o):(o.type||'Status');return '<div style="padding:4px 0;border-top:1px solid #dbe7df"><b>'+(t?t.name:o.code)+'</b> ('+o.code+') — '+l+'</div>'}).join('')}catch(_){}}function refresh(){installRange();cleanDPB();fixSummary()}function focus(){try{const w=f.contentWindow,d=f.contentDocument;if(!d)return false;installRange();if(typeof w.show==='function'){w.show('allot');m.style.display='none';setTimeout(refresh,50);return true}return false}catch(_){return false}}f.addEventListener('load',()=>{let n=0,t=setInterval(()=>{if(focus()||++n>20)clearInterval(t)},300);try{const d=f.contentDocument;d.addEventListener('change',e=>{if(e.target&&e.target.id==='proxyWorkDate'){setTimeout(refresh,0);setTimeout(refresh,200)}},true);d.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;let x=b;for(let n=0;n<4&&x;n++,x=x.parentElement)if(dpb(x.textContent||'')&&/^allot$/i.test((b.textContent||'').trim())){e.preventDefault();e.stopImmediatePropagation();return}setTimeout(refresh,60)},true)}catch(_){}setTimeout(refresh,600)});</script></body></html>
