electorAll('button,a')].some(b=>/\ballot\b/i.test(b.textContent||'')));const target=child||el;if(target&&target!==d.body&&target!==d.documentElement){target.remove();changed=true}}return changed}catch(e){return false}}function focusProxy(){try{const w=f.contentWindow,d=f.contentDocument;if(!d)return false;excludeDPB();if(typeof w.show==='function'){w.show('allot');m.style.display='none';return true}const btn=[...d.querySelectorAll('button,a')].find(x=>(x.textContent||'').toLowerCase().includes('proxy allotment')||(x.textContent||'').toLowerCase().includes('proxy manager'));if(btn){btn.click();m.style.display='none';return true}}catch(e){}return false}f.addEventListener('load',()=>{let n=0,t=setInterval(()=>{focusProxy();excludeDPB();if(++n>120)clearInterval(t)},250);try{const d=f.contentDocument;if(d){d.addEventListener('click',e=>{const b=e.target.closest('button,a');if(b&&/\ballot\b/i.test(b.textContent||'')&&isDPBText(b.closest('div,li,tr,section,article')?.textContent||'')){e.preventDefault();e.stopImmediatePropagation()}},true);const mo=new MutationObserver(()=>excludeDPB());mo.observe(d.documentElement,{childList:true,subtree:true})}}catch(e){}});</script></body></html>
