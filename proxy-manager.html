<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>VKVTT · Proxy Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#edf6f1;color:#17364f}header{height:66px;background:#1f678f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}h1{font-size:1.25rem;margin:0}.btn{font-weight:800;text-decoration:none;color:#17364f;background:#eef7fb;border:1px solid #bad0db;border-radius:10px;padding:9px 12px}iframe{display:block;width:100%;height:calc(100vh - 66px);border:0;background:#edf6f1}#msg{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#fff7dd;border:1px solid #dfbf62;border-radius:10px;padding:9px 12px;z-index:10}</style></head><body><header><h1>👥 Proxy Manager</h1><div><a class="btn" href="./?v=66.0">🏠 Home</a></div></header><div id="msg">Loading the proven Proxy Manager workspace…</div><iframe id="frame" src="./proxy-manager-core.html?proxy-manager=1&v=20260904-proxy-corefix-3"></iframe><script>
const f=document.getElementById('frame'),m=document.getElementById('msg');
function dpbRecord(t){const code=String(t&&t.code||'').trim().toUpperCase(),name=String(t&&t.name||'').trim().toLowerCase();return code==='DPB'||name==='dhruba prasad baruah'}
function safe(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function installCoreOverrides(){
 try{
  const w=f.contentWindow,d=f.contentDocument;if(!w||!d)return false;
  if(typeof w.todayKey!=='function'||typeof w.dateFromKey!=='function'||typeof w.dateKeyFromDate!=='function'||typeof w.operationalTeachers!=='function'||typeof w.proxyDateKey!=='function'||typeof w.leaveData!=='function')return false;
  if(!w.__vkvProxyFixInstalled){
   w.__vkvProxyFixInstalled=true;
   const originalOperationalTeachers=w.operationalTeachers.bind(w);
   w.operationalTeachers=function(date){return (originalOperationalTeachers(date)||[]).filter(t=>!dpbRecord(t))};
   w.proxyFutureLimitKey=function(){let x=w.dateFromKey(w.todayKey()),n=0;while(n<3){x.setDate(x.getDate()+1);if(x.getDay()!==0)n++}return w.dateKeyFromDate(x)};
   w.renderTodayProxyStatusSummary=function(){
    const out=d.getElementById('proxyTodayStatusSummary');if(!out)return;
    const date=w.proxyDateKey(),today=w.todayKey();
    const rows=(w.leaveData(date)||[]).filter(o=>o&&['full','half','od','special','vacant'].includes(o.type));
    const label=typeof w.displayDate==='function'?w.displayDate(date):date;
    const title=date===today?'Today’s Leave / Duty Leave / Operational Status Summary':'Leave / Duty Leave / Operational Status for '+label;
    if(!rows.length){out.innerHTML='<b>'+safe(title)+'</b><div class="small" style="margin-top:5px">'+(date===today?'No approved Leave, Duty Leave or Vacant Position record is available for today.':'No approved or scheduled Leave / Duty Leave / Operational Status record is available for this selected date. Today’s status is not carried forward.')+'</div>';return}
    out.innerHTML='<b>'+safe(title)+'</b><div class="small" style="margin:4px 0 8px">'+rows.length+' staff record'+(rows.length===1?'':'s')+' applicable to '+safe(label)+'.</div>'+rows.map(o=>{let t=null;try{t=w.teacherByEffectiveCode(o.code,date)}catch(_){ }let text='';try{text=w.statusLabel(o)}catch(_){text=o.type||'Status'}return '<div style="padding:4px 0;border-top:1px solid #dbe7df"><b>'+safe(t?t.name:o.code)+'</b> ('+safe(o.code)+') — '+safe(text)+'</div>'}).join('');
   };
  }
  const input=d.getElementById('proxyWorkDate'),hint=input?.parentElement?.querySelector('.small');if(hint)hint.textContent='Today and at least the next three school days are available normally. Sundays are skipped. An earlier date requires Principal authorisation.';
  w.renderTodayProxyStatusSummary();
  if(typeof w.renderProxyPeriod==='function')w.renderProxyPeriod();
  return true;
 }catch(e){console.warn('Proxy compatibility fix:',e);return false}
}
function focusProxy(){try{const w=f.contentWindow;if(typeof w.show==='function'){w.show('allot');m.style.display='none';return true}}catch(_){ }return false}
f.addEventListener('load',()=>{let tries=0;const t=setInterval(()=>{const ok=installCoreOverrides();focusProxy();if(ok||++tries>30)clearInterval(t)},250);try{const d=f.contentDocument;d.addEventListener('change',e=>{if(e.target&&e.target.id==='proxyWorkDate')setTimeout(()=>{installCoreOverrides();const w=f.contentWindow;if(typeof w.renderTodayProxyStatusSummary==='function')w.renderTodayProxyStatusSummary();if(typeof w.renderProxyPeriod==='function')w.renderProxyPeriod()},80)},true)}catch(_){}});
</script></body></html>
