<title>VKVTT · Proxy Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#edf6f1;color:#17364f}header{min-height:66px;background:#1f678f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;gap:12px;flex-wrap:wrap}h1{font-size:1.25rem;margin:0}.headActions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{font:inherit;font-weight:800;text-decoration:none;color:#17364f;background:#eef7fb;border:1px solid #bad0db;border-radius:10px;padding:9px 12px;cursor:pointer}.emergency{background:#8b2d2d;color:#fff;border-color:#b65a5a}.emergency:hover{background:#762323}.emergency:disabled{opacity:.65;cursor:wait}iframe{display:block;width:100%;height:calc(100vh - 66px);border:0;background:#edf6f1}#msg{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#fff7dd;border:1px solid #dfbf62;border-radius:10px;padding:9px 12px;z-index:10;max-width:min(760px,92vw);text-align:center}#msg.ok{background:#edf9ef;border-color:#88bd91;color:#21562c}@media(max-width:700px){header{align-items:flex-start}.headActions{width:100%}.headActions .btn{flex:1;text-align:center}iframe{height:calc(100vh - 116px)}}

<body>
<header><h1>👥 Proxy Manager</h1><div class="headActions"><button id="emergencyEditTop" class="btn emergency" type="button">🚨 Emergency Edit / Reload</button><a class="btn" href="./?v=66.0">🏠 Home</a></div></header>
<div id="msg">Loading Proxy Manager…</div>
<iframe id="frame" src="./proxy-manager-core.html?proxy-manager=1&v=20260908-emergency-edit-6"></iframe>
<script>
const f=document.getElementById('frame'),m=document.getElementById('msg'),topEmergency=document.getElementById('emergencyEditTop');
function dpbRecord(t){const code=String(t&&t.code||'').trim().toUpperCase(),name=String(t&&t.name||'').trim().toLowerCase();return code==='DPB'||name==='dhruba prasad baruah'}
function setMsg(text,ok=false){m.textContent=text;m.classList.toggle('ok',!!ok);m.style.display='block';if(ok)setTimeout(()=>{m.style.display='none'},5000)}
async function waitForCore(ms=12000){const start=Date.now();while(Date.now()-start<ms){try{const w=f.contentWindow;if(w&&typeof w.proxyDateKey==='function'&&typeof w.todayKey==='function'&&(typeof w.loadProxyWorkCloud==='function'||typeof w.loadProxyWorkState==='function'))return w}catch(_){}await new Promise(r=>setTimeout(r,150))}throw new Error('Proxy Manager is still loading. Please refresh once and try again.')}
async function reloadLatest(w,date){if(typeof w.loadProxyWorkCloud==='function'){await w.loadProxyWorkCloud(date);return}if(typeof w.loadProxyWorkState==='function'){await w.loadProxyWorkState(date);return}throw new Error('Latest Leave / Duty reload service is not ready.')}
function currentPublished(w,date){const a=w.__vkvWorkPublishedProxy,b=w.__vkvPublishedProxy;if(a&&a.date===date)return a;if(b&&b.date===date)return b;return null}
function statusSig(r){return [String(r?.code||r?.teacherCode||''),String(r?.type||''),Number(r?.from||0),Number(r?.to||0),String(r?.duration||''),String(r?.leaveCategory||''),String(r?.note||''),String(r?.planId||r?.id||'')].join('|')}
function installMultiStatusSourceFix(w){
 if(w.__vkvMultiStatusSourceFixInstalled)return true;
 if(typeof w.storedStatusData!=='function'||typeof w.plannedStatusesForDate!=='function'||typeof w.activeLeaveAt!=='function')return false;
 w.__vkvMultiStatusSourceFixInstalled=true;
 const stored=w.storedStatusData.bind(w),planned=w.plannedStatusesForDate.bind(w);
 w.mergeEffectiveStatuses=function(base,extra){const out=[],seen=new Set();for(const r of [...(base||[]),...(extra||[])]){if(!r)continue;const s=statusSig(r);if(seen.has(s))continue;seen.add(s);out.push(r)}return out};
 w.leaveData=function(date=w.todayKey()){return w.mergeEffectiveStatuses(stored(date),planned(date))};
 return true;
}
function openEditableWorkspace(w){const d=f.contentDocument;try{if(typeof w.show==='function')w.show('allot',d.getElementById('proxyWorkBtn'))}catch(_){}try{if(typeof w.renderProxyLockState==='function')w.renderProxyLockState()}catch(_){}try{if(typeof w.renderTodayProxyStatusSummary==='function')w.renderTodayProxyStatusSummary()}catch(_){}try{const rows=typeof w.proxyRows==='function'?w.proxyRows():[],a=typeof w.allotData==='function'?w.allotData():{},s=typeof w.supervisionData==='function'?w.supervisionData():{};const unmet=rows.find(r=>{try{const k=typeof w.needKey==='function'?w.needKey(r):'';return k&&!a[k]&&!s[k]}catch(_){return false}});if(unmet&&unmet.period&&d.getElementById('allotPeriod')&&typeof w.jumpProxyPeriod==='function'){d.getElementById('allotPeriod').value=String(unmet.period);w.jumpProxyPeriod()}else if(typeof w.renderProxyPeriod==='function')w.renderProxyPeriod()}catch(_){try{if(typeof w.renderProxyPeriod==='function')w.renderProxyPeriod()}catch(__){}}try{d.getElementById('allot')?.scrollIntoView({behavior:'smooth',block:'start'})}catch(_){}}
async function emergencyEditReload(){topEmergency.disabled=true;const old=topEmergency.textContent;topEmergency.textContent='↻ Reloading latest Leave / Duty…';try{const w=await waitForCore(),date=w.proxyDateKey();installMultiStatusSourceFix(w);await reloadLatest(w,date);installMultiStatusSourceFix(w);let pub=currentPublished(w,date);if(!pub){openEditableWorkspace(w);setMsg('Latest Leave / Duty data reloaded from cloud. Same-day multiple status records are preserved now.',true);return}if(!w.__vkvWorkPublishedProxy||w.__vkvWorkPublishedProxy.date!==date)w.__vkvWorkPublishedProxy=pub;if(!pub.correctionEnabled){if(date<w.todayKey()){if(typeof w.authoriseHistoricalProxy!=='function')throw new Error('Historical Proxy authorisation is not ready.');await w.authoriseHistoricalProxy()}else{if(typeof w.enableProxyCorrection!=='function')throw new Error('Emergency correction service is not ready.');await w.enableProxyCorrection()}}await reloadLatest(w,date);installMultiStatusSourceFix(w);pub=currentPublished(w,date);if(pub&&!pub.correctionEnabled)throw new Error('The Proxy remains locked. Principal correction was not enabled.');openEditableWorkspace(w);setMsg('Emergency edit is open. Multiple same-day Leave / OD / Special Assignment records are preserved independently.',true)}catch(e){alert('Emergency Proxy edit could not be opened: '+(e?.message||e));setMsg('Emergency edit could not be opened. '+(e?.message||e),false)}finally{topEmergency.disabled=false;topEmergency.textContent=old}}
topEmergency.addEventListener('click',emergencyEditReload);
function installCoreOverrides(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||typeof w.operationalTeachers!=='function')return false;if(!w.__vkvProxyWrapperFixInstalled){w.__vkvProxyWrapperFixInstalled=true;const original=w.operationalTeachers.bind(w);w.operationalTeachers=function(date){return(original(date)||[]).filter(t=>!dpbRecord(t))}}installMultiStatusSourceFix(w);if(window.VKVTheme)window.VKVTheme.applyToDocument(d,window.VKVTheme.get());return true}catch(e){console.warn('Proxy wrapper setup:',e);return false}}
function installFinalPrintSafety(){try{const d=f.contentDocument;if(!d||d.getElementById('vkvProxyFinalSafety'))return;const st=d.createElement('style');st.id='vkvProxyFinalSafety';st.textContent='@media print{#publishedProxy,#publishedProxy *{background:#fff!important;color:#000!important}#publishedProxy table{border-collapse:collapse!important}#publishedProxy th,#publishedProxy td{border-color:#000!important}}';d.head.appendChild(st)}catch(_){}}
f.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{const ok=installCoreOverrides();installFinalPrintSafety();try{const w=f.contentWindow;if(typeof w.show==='function'){w.show('allot');m.style.display='none'}}catch(_){}if(ok||++n>50)clearInterval(t)},200)});
window.addEventListener('vkv-theme-change',()=>{try{if(window.VKVTheme&&f.contentDocument)window.VKVTheme.applyToDocument(f.contentDocument,window.VKVTheme.get())}catch(_){}});
</script>
