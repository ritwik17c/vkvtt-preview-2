<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>VKVTT · QB Recovery</title><style>*{box-sizing:border-box}body{margin:0;background:#edf6f1;color:#17364f;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{background:#1d638e;color:#fff;padding:16px}.wrap{max-width:900px;margin:auto;padding:0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{font:inherit;font-weight:750;border:1px solid #b9ced9;border-radius:11px;padding:10px 13px;background:#e7f2f7;color:#17364f;text-decoration:none;cursor:pointer}.primary{background:#236d99;color:#fff}.card{background:#fff;border:1px solid #cbdce5;border-radius:16px;padding:16px;margin:14px 0}.small{font-size:.86rem;color:#617685}.ok{background:#eaf7ed;border:1px solid #b9ddc1;border-radius:10px;padding:10px;color:#245c34}.warn{background:#fff7df;border:1px solid #e5cd8c;border-radius:10px;padding:10px;color:#745917}.list{display:grid;gap:8px}.q{border:1px solid #dbe6eb;border-radius:10px;padding:10px;background:#fbfefd}</style></head><body><header><div class="wrap"><h1 style="margin:0">📚 Question Bank Recovery</h1><div>Minimal diagnostic workspace</div><div class="actions" style="margin-top:10px"><a class="btn" href="./">← Home</a><a class="btn" href="QB_TEACHER_GUIDE.html">❓ Guidance</a></div></div></header><main class="wrap"><section class="card"><h2 style="margin-top:0">Access check</h2><div id="status" class="small">Page loaded. Firebase has not started yet.</div><div class="actions" style="margin-top:12px"><button id="checkBtn" class="primary">Check my QB access</button><button id="loginBtn">Sign in with Google</button></div></section><section id="whoCard" class="card" hidden><h2 style="margin-top:0">Account</h2><div id="who"></div><div class="actions" style="margin-top:12px"><button id="loadBtn" class="primary">Load latest 25 questions</button></div></section><section id="questionsCard" class="card" hidden><h2 style="margin-top:0">Latest questions</h2><div id="questions" class="list"></div></section></main><script type="module">import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,getDoc,collection,getDocs,query,where,limit}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-lite.js';const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'};const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));await setPersistence(auth,browserLocalPersistence).catch(()=>{});$('status').textContent='Firebase ready. Press “Check my QB access”.';async function profileFor(u){const a=await getDoc(doc(db,'authorizedUsers',u.uid)).catch(()=>null);if(a?.exists()&&a.data().active!==false)return a.data()||{};const email=String(u.email||'').trim().toLowerCase();if(!email)return null;const v=await getDoc(doc(db,'viewerEmails',email)).catch(()=>null);return v?.exists()&&v.data().active!==false?{role:'teacher',...(v.data()||{})}:null}async function check(){const u=auth.currentUser;if(!u){$('status').innerHTML='<div class="warn">No restored Google session yet. Use “Sign in with Google”.</div>';return}const p=await profileFor(u);if(!p){$('status').innerHTML='<div class="warn">This Google account is not authorised for VKVTT.</div>';return}$('status').innerHTML='<div class="ok">QB access recognised successfully.</div>';$('who').innerHTML='<b>'+esc(u.email||u.displayName||'Google account')+'</b><div class="small">Role: '+esc(p.role||'staff')+'</div>';$('whoCard').hidden=false;window.__qbUser=u}async function login(){provider.setCustomParameters({prompt:'select_account'});await signInWithPopup(auth,provider);await check()}async function loadMine(){const u=window.__qbUser||auth.currentUser;if(!u)return;const s=await getDocs(query(collection(db,'qbQuestions'),where('teacherUid','==',u.uid),limit(25)));const rows=s.docs.map(d=>({id:d.id,...d.data()}));$('questions').innerHTML=rows.length?rows.map(q=>'<div class="q"><b>'+esc(q.questionText||'(No question text)')+'</b><div class="small">'+esc(q.className||'')+' · '+esc(q.subject||'')+' · '+esc(q.status||'')+'</div></div>').join(''):'<div class="small">No UID-linked questions found in the latest 25 query.</div>';$('questionsCard').hidden=false}$('checkBtn').onclick=()=>check().catch(e=>$('status').innerHTML='<div class="warn">'+esc(e.message||e)+'</div>');$('loginBtn').onclick=()=>login().catch(e=>$('status').innerHTML='<div class="warn">'+esc(e.message||e)+'</div>');$('loadBtn').onclick=()=>loadMine().catch(e=>$('questions').innerHTML='<div class="warn">'+esc(e.message||e)+'</div>');</script></body></html>
