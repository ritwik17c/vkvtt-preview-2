<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office Duty Scheduler · VKV Nalbari</title><style>:root{--ink:#17364f;--muted:#647986;--line:#c8d9e2;--bg:#edf6f1;--blue:#236d99;--gold:#cf941b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Segoe UI,Arial;color:#24394b}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #17324d12}h1,h2{color:var(--ink);margin-top:0}.muted{color:var(--muted)}button,a.btn{font:inherit;font-weight:800;border:1px solid #b9ced9;border-radius:11px;padding:10px 13px;background:#e7f2f7;color:var(--ink);cursor:pointer;text-decoration:none}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{background:#fff0f0;color:#8a3030;border-color:#e1bcbc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dutyRow{border:1px solid #d6e2e8;border-left:5px solid var(--blue);border-radius:15px;padding:13px;margin:10px 0;background:#fbfefd}.days{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.daychip{display:flex;align-items:center;gap:5px;border:1px solid #c9dbe4;border-radius:999px;padding:7px 10px;background:#fff;font-weight:750}.daychip input{width:auto}.fields{display:grid;grid-template-columns:1.25fr 1.35fr .7fr .7fr auto;gap:9px;align-items:end}label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 5px}input,select{width:100%;padding:10px;border:1px solid #c7d5de;border-radius:10px;background:#fff;font:inherit}.status{display:none;padding:10px 12px;border-radius:10px;background:#eef7fb;margin-top:10px}.help{padding:10px 12px;border-left:4px solid var(--gold);background:#fff8e5;border-radius:10px}@media(max-width:850px){.fields{grid-template-columns:1fr 1fr}.fields .removeCell{grid-column:1/-1}}@media(max-width:520px){.fields{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a class="btn" href="admin-dashboard.html">← Admin Dashboard</a></div><div class="card"><h1>🏢 Office Duty Scheduler</h1><div class="muted">Create recurring Non-Teaching duty rows. Tick one or more days, set From and To time, then save the complete schedule.</div></div><div class="card"><div class="top"><h2 style="margin:0">Duty Rows</h2><button id="addRow">＋ Add Row</button></div><div class="help">A single row can apply to several weekdays. Use 24-hour or browser time selection for precise From/To timings.</div><div id="rows"></div><div class="actions"><button id="saveAll" class="primary">Save Office Duty Schedule</button></div><div id="msg" class="status"></div></div></div><script type="module">import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,updateDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-lite.js';const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'},app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let M={},wrapped=true,staff=[],rows=[];const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function staffOptions(sel=''){return staff.map(x=>{const c=String(x.code||x.employeeCode||''),n=x.name||x.fullName||c;return`<option value="${safe(c)}" ${c===sel?'selected':''}>${safe(n)} (${safe(c)})</option>`}).join('')}function normalize(r){if(Array.isArray(r.days))return{...r,days:r.days,from:r.from||'',to:r.to||''};return{id:r.id||'OD_'+Date.now()+Math.random(),days:r.day?[r.day]:[],staffCode:r.staffCode||'',staffName:r.staffName||'',duty:r.duty||'',from:r.from||String(r.slot||'').split(/[–-]/)[0]?.trim()||'',to:r.to||String(r.slot||'').split(/[–-]/)[1]?.trim()||'',active:r.active!==false}}function rowHtml(r,i){return`<div class="dutyRow" data-i="${i}"><div class="days">${DAYS.map(d=>`<label class="daychip"><input type="checkbox" data-day="${d}" ${r.days.includes(d)?'checked':''}> ${d.slice(0,3)}</label>`).join('')}</div><div class="fields"><div><label>Staff</label><select data-k="staffCode">${staffOptions(r.staffCode)}</select></div><div><label>Duty / Location</label><input data-k="duty" value="${safe(r.duty||'')}" placeholder="Office / Accounts / Gate..."></div><div><label>From</label><input type="time" data-k="from" value="${safe(r.from||'')}"></div><div><label>To</label><input type="time" data-k="to" value="${safe(r.to||'')}"></div><div class="removeCell"><button type="button" class="danger" data-del="${i}">Delete</button></div></div></div>`}function render(){if(!rows.length)rows=[normalize({days:['Monday'],staffCode:staff[0]?.code||staff[0]?.employeeCode||'',duty:'',from:'',to:''})];$('rows').innerHTML=rows.map(rowHtml).join('')}function readRows(){return[...document.querySelectorAll('.dutyRow')].map((el,i)=>{const days=[...el.querySelectorAll('[data-day]:checked')].map(x=>x.dataset.day),code=el.querySelector('[data-k="staffCode"]').value,st=staff.find(x=>String(x.code||x.employeeCode||'')===code);return{id:rows[i]?.id||'OD_'+Date.now()+'_'+i,days,staffCode:code,staffName:st?.name||st?.fullName||code,duty:el.querySelector('[data-k="duty"]').value.trim(),from:el.querySelector('[data-k="from"]').value,to:el.querySelector('[data-k="to"]').value,active:true,updatedAtMs:Date.now()}})}async function persist(){rows=readRows();for(const r of rows){if(!r.days.length)throw Error('Please tick at least one day in every duty row.');if(!r.staffCode)throw Error('Please select a staff member in every row.');if(!r.from||!r.to)throw Error('Please enter both From and To time in every row.');if(r.to<=r.from)throw Error('To time must be later than From time.')}const ref=doc(db,'master','current');if(wrapped)await updateDoc(ref,{'data.officeDutySchedule':rows,'data.officeDutyScheduleUpdatedAtMs':Date.now()});else await setDoc(ref,{officeDutySchedule:rows,officeDutyScheduleUpdatedAtMs:Date.now()},{merge:true});$('msg').style.display='block';$('msg').textContent='Office duty schedule saved.'}$('addRow').onclick=()=>{rows=readRows();rows.push(normalize({days:[],staffCode:staff[0]?.code||staff[0]?.employeeCode||'',duty:'',from:'',to:''}));render()};document.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;rows=readRows();rows.splice(+b.dataset.del,1);render()});$('saveAll').onclick=async()=>{try{await persist()}catch(e){$('msg').style.display='block';$('msg').textContent=e.message||e}};async function load(){const s=await getDoc(doc(db,'master','current')),raw=s.data()||{};wrapped=!!raw.data;M=raw.data||raw;staff=(M.nonTeachingStaff||[]).filter(x=>x&&x.active!==false);rows=(Array.isArray(M.officeDutySchedule)?M.officeDutySchedule:[]).map(normalize);render()}onAuthStateChanged(auth,async u=>{if(!u)return alert('Sign in with Admin account first.');const p=await getDoc(doc(db,'authorizedUsers',u.uid));if(!p.exists()||p.data().active!==true||p.data().role!=='admin')return alert('Admin access required.');load()});</script></body></html>
