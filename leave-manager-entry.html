<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>VKVTT · Quick Add Leave / Duty</title>
<style>
:root{--ink:#17364f;--muted:#617685;--line:#cbdce5;--bg:#edf6f1;--deep:#236d99;--ok:#e7f6ea;--warn:#fff7df;--bad:#fdecec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#263d4e}header{background:#123d68;color:#fff;padding:16px}.wrap{max-width:900px;margin:auto;padding:0 14px}.head,.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}main{padding:18px 0 55px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.status{padding:10px 12px;border-radius:11px;background:#eef7fb;border:1px solid #c9dfe9}.ok{background:var(--ok);color:#245c34}.warn{background:var(--warn);color:#76570f}.error{background:var(--bad);color:#8b2d2d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-size:.82rem;color:var(--muted);margin:7px 0 5px}select,input,textarea{width:100%;font:inherit;padding:10px;border:1px solid #c7d5de;border-radius:10px;background:#fbfefd}textarea{min-height:80px}.btn,button{font:inherit;font-weight:750;border:1px solid #b9ced9;border-radius:11px;padding:10px 13px;background:#e7f2f7;color:var(--ink);cursor:pointer;text-decoration:none}.primary{background:var(--deep);color:#fff;border-color:var(--deep)}.help{font-size:.86rem;color:var(--muted);line-height:1.45}.hide{display:none!important}@media(max-width:650px){.grid2,.grid3{grid-template-columns:1fr}}</style>
</head><body><header><div class="wrap head"><div><h1 style="margin:0;font-size:1.45rem">➕ Quick Add Leave / Duty</h1><div style="opacity:.9;font-size:.88rem">Provisional entry · Principal approval required</div></div><a class="btn" href="leave-manager.html">← Leave Manager</a></div></header>
<main class="wrap"><section class="card"><div id="gate" class="status">Checking access…</div></section>
<section id="formCard" class="card hide"><div class="help"><b>Workflow:</b> Save here → Pending Approval → Principal approves/returns. This page never posts an official leave record directly.</div>
<div class="grid2"><div><label>Teacher / Staff *</label><select id="teacher"></select></div><div><label>Status *</label><select id="statusType"><option value="leave">Regular Leave</option><option value="od">On Duty (OD)</option><option value="special">Special Assignment</option></select></div></div>
<div class="grid3"><div id="catWrap"><label>Leave Category *</label><select id="category"><option value="">Select…</option><option>CL</option><option>EL</option><option>VL</option><option>SEL</option><option>EOL</option><option value="MATERNITY">Maternity Leave</option></select></div><div><label>Date Mode</label><select id="dateMode"><option value="single">Single Date</option><option value="range">Continuous Range</option><option value="multiple">Multiple Dates</option></select></div><div><label>Day Coverage</label><select id="coverage"><option value="full">Full Day</option><option value="half-am">First Half</option><option value="half-pm">Second Half</option><option value="custom">Custom Periods</option></select></div></div>
<div id="singleBox"><label>Date *</label><input id="singleDate" type="date"></div>
<div id="rangeBox" class="grid2 hide"><div><label>From Date *</label><input id="fromDate" type="date"></div><div><label>To Date *</label><input id="toDate" type="date"></div></div>
<div id="multipleBox" class="hide"><label>Multiple Dates *</label><textarea id="multipleDates" placeholder="Enter dates as DD/MM/YYYY or YYYY-MM-DD, separated by commas or new lines"></textarea></div>
<div id="periodBox" class="grid2 hide"><div><label>From Period</label><input id="fromP" type="number" min="1" max="12"></div><div><label>To Period</label><input id="toP" type="number" min="1" max="12"></div></div>
<div class="grid2"><div><label>Leave Units</label><input id="units" type="number" min="0" step="0.5" value="1"></div><div><label>Reason / Reference *</label><input id="reason" placeholder="Short reason / reference"></div></div>
<label>Remarks</label><textarea id="remarks" placeholder="Optional remarks"></textarea>
<div class="actions" style="margin-top:12px"><button id="save" class="primary">Submit for Principal Approval</button><a class="btn" href="leave-manager-approvals.html">View Pending Approvals</a></div><div id="msg" class="status hide" style="margin-top:10px"></div></section></main>
<script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import{getAuth,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-lite.js';
const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'},app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),mail=v=>String(v||'').trim().toLowerCase();await setPersistence(auth,browserLocalPersistence).catch(()=>{});
let user=null,profile=null,master={};function tokenRole(p){const r=String(p?.role||'').toLowerCase(),a=[...(p?.roles||[]),...(p?.delegatedRoles||[]),...(p?.responsibilities||[])].map(x=>String(x).toLowerCase());if(r==='admin')return'admin';if(r==='leave_editor'||a.includes('leave_editor')||a.includes('leave editor')||p?.permissions?.leaveEditor===true||p?.permissions?.leave_editor===true||p?.leaveEditor===true)return'leave_editor';return r}
async function resolveProfiles(u){let uidP=null,emailP=null;const a=await getDoc(doc(db,'authorizedUsers',u.uid)).catch(()=>null);if(a?.exists()&&a.data().active!==false)uidP=a.data();if(u.email){const v=await getDoc(doc(db,'viewerEmails',mail(u.email))).catch(()=>null);if(v?.exists()&&v.data().active!==false)emailP=v.data()}return{uidP,emailP}}
function effectiveRole(uidP,emailP){if(tokenRole(uidP)==='admin')return'admin';if(tokenRole(uidP)==='leave_editor'||tokenRole(emailP)==='leave_editor')return'leave_editor';return tokenRole(uidP)||tokenRole(emailP)}
function codeOf(t){return String(t?.code||t?.shortCode||t?.teacherShortCode||t?.timetableCode||'').trim()}function fillTeachers(){const all=[...(master.teachers||[]),...(master.staffDirectory||[]).filter(x=>String(x.category||x.staffCategory||'').toLowerCase().includes('non'))],seen=new Set(),opts=[];for(const t of all){const c=codeOf(t);if(!c||seen.has(c))continue;seen.add(c);opts.push({c,n:t.name||t.fullName||c})}opts.sort((a,b)=>a.n.localeCompare(b.n));$('teacher').innerHTML='<option value="">Select…</option>'+opts.map(x=>`<option value="${x.c}">${x.n} (${x.c})</option>`).join('')}
function sync(){const st=$('statusType').value,mode=$('dateMode').value,cov=$('coverage').value;$('catWrap').classList.toggle('hide',st!=='leave');$('singleBox').classList.toggle('hide',mode!=='single');$('rangeBox').classList.toggle('hide',mode!=='range');$('multipleBox').classList.toggle('hide',mode!=='multiple');$('periodBox').classList.toggle('hide',cov!=='custom');if(st!=='leave')$('category').value='';$('units').value=st==='leave'?(cov==='full'?'1':'0.5'):'0'}
['statusType','dateMode','coverage'].forEach(id=>$(id).onchange=sync);
function parseDate(v){v=String(v||'').trim();let m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)return`${m[3]}-${m[2]}-${m[1]}`;m=v.match(/^\d{4}-\d{2}-\d{2}$/);return m?v:''}function dates(){const mode=$('dateMode').value;if(mode==='single')return[$('singleDate').value].filter(Boolean);if(mode==='range'){const a=$('fromDate').value,b=$('toDate').value;if(!a||!b||a>b)return[];const out=[],d=new Date(a+'T00:00:00'),z=new Date(b+'T00:00:00');for(let i=0;d<=z&&i<370;i++,d.setDate(d.getDate()+1))out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));return out}return[...new Set($('multipleDates').value.split(/[\n,;]+/).map(parseDate).filter(Boolean))].sort()}
function show(t,bad=false){$('msg').className='status '+(bad?'error':'ok');$('msg').textContent=t;$('msg').classList.remove('hide')}
$('save').onclick=async()=>{const code=$('teacher').value,st=$('statusType').value,ds=dates(),reason=$('reason').value.trim();if(!code)return show('Select the teacher/staff member.',true);if(st==='leave'&&!$('category').value)return show('Select the leave category.',true);if(!ds.length)return show('Enter at least one valid date/date range.',true);if(reason.length<3)return show('Enter a short reason/reference.',true);const cov=$('coverage').value,entry={statusType:st,type:st==='leave'?'leave':st,leaveCategory:st==='leave'?$('category').value:'',leaveUnits:st==='leave'?Number($('units').value||0):0,coverage:cov,reason,remarks:$('remarks').value.trim()};if($('dateMode').value==='single')entry.date=ds[0];else if($('dateMode').value==='range'){entry.startDate=ds[0];entry.endDate=ds.at(-1)}else entry.dates=ds;if(cov==='custom'){entry.from=Number($('fromP').value||0);entry.to=Number($('toP').value||0);if(!entry.from||!entry.to||entry.from>entry.to)return show('Enter a valid custom period range.',true)}else if(cov==='half-am'){entry.from=1;entry.to=4}else if(cov==='half-pm'){entry.from=5;entry.to=8}const opt=$('teacher').selectedOptions[0],staffName=(opt?.textContent||code).replace(/\s*\([^)]*\)\s*$/,'').trim(),id='LREQ_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);const data={id,code,staffName,entries:[entry],approvalStatus:'provisional',createdByUid:user.uid,createdByEmail:user.email||'',createdByRole:profile?.effectiveRole||'',createdAtMs:Date.now(),updatedAt:serverTimestamp()};$('save').disabled=true;show('Submitting provisional entry…');try{await setDoc(doc(db,'provisionalLeavePlans',id),data,{merge:false});show('Submitted for Principal approval. No official leave record has been posted yet.');$('reason').value='';$('remarks').value=''}catch(e){show('Could not submit: '+(e.message||e),true)}finally{$('save').disabled=false}};
user=auth.currentUser;if(!user){$('gate').className='status warn';$('gate').textContent='Please sign in from Timetable Home first.'}else{try{const{uidP,emailP}=await resolveProfiles(user),role=effectiveRole(uidP,emailP);profile={uidP,emailP,effectiveRole:role};if(!uidP&&!emailP)throw Error('This account is not authorised in VKVTT.');if(!['admin','leave_editor'].includes(role))throw Error('Leave Editor or Principal/Admin access is required.');const m=await getDoc(doc(db,'master','current'));if(!m.exists())throw Error('Master timetable is not available.');const raw=m.data()||{},wrapped=raw.data&&typeof raw.data==='object'?raw.data:{};master={...raw,...wrapped};fillTeachers();sync();$('gate').className='status ok';$('gate').textContent=role==='admin'?'Principal/Admin access confirmed. Entry will remain provisional until approved.':'Leave Editor access confirmed. Entry will remain provisional until Principal approval.';$('formCard').classList.remove('hide')}catch(e){$('gate').className='status error';$('gate').textContent=e.message||e}}
</script>
