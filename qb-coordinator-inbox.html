<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Coordinator Inbox · VKVTT</title><style>body{margin:0;background:#edf6f1;color:#17364f;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.bar{background:#1d638e;color:#fff;padding:15px}.wrap{max-width:1050px;margin:auto;padding:0 14px}.card{background:#fff;border:1px solid #cbdce5;border-radius:16px;padding:17px;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn,button{font:inherit;font-weight:750;border:1px solid #bdd2dd;border-radius:10px;padding:9px 12px;background:#e7f2f7;color:#17364f;text-decoration:none;cursor:pointer}.primary{background:#236d99;color:#fff}.green{background:#e5f5e8;color:#245c34;border-color:#acd0b5}.tip,.ok,.warn{padding:10px 12px;border-radius:10px;margin:9px 0}.tip{background:#eef7fb}.ok{background:#e8f7ec}.warn{background:#fff7df}.q{border:1px solid #dbe6eb;border-radius:13px;padding:12px;margin:9px 0;background:#fbfefd}.small{font-size:.84rem;color:#617685}.badge{display:inline-block;background:#edf4f7;border-radius:999px;padding:3px 8px;margin:4px 5px 0 0;font-size:.78rem}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.history{margin-top:9px;padding:10px 12px;background:#f7fafb;border:1px solid #dbe6eb;border-radius:10px}.event{padding:7px 0;border-bottom:1px solid #e4ecef}.event:last-child{border-bottom:0}.event b{font-size:.86rem}.note{margin-top:4px;padding:7px 9px;background:#fff7df;border-radius:8px;color:#4d5860}select,input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #c6d7e0;border-radius:9px;font:inherit}@media(max-width:650px){.filters{grid-template-columns:1fr}}</style></head><body><div class="bar"><div class="wrap actions"><a class="btn" href="qb-teacher-hub.html">← Question Bank</a><div><b>🧑‍🏫 Subject Coordinator Inbox</b><div style="font-size:.84rem;opacity:.9">Verify or return submitted questions only for your assigned subjects</div></div></div></div><main class="wrap"><section class="card"><div id="gate" class="tip">Checking coordinator responsibility…</div></section><section id="work" class="card" style="display:none"><div id="scope" class="ok"></div><div class="actions"><button id="load" class="primary">Load Pending Questions</button><button id="refresh">Refresh</button></div><div class="filters" style="margin-top:10px"><div><label class="small">Subject</label><select id="subjectFilter"><option value="">All assigned subjects</option></select></div><div><label class="small">Search</label><input id="search" placeholder="Question, teacher, class…"></div></div><div id="status" class="tip">Questions are loaded only when you request them.</div><div id="list"></div></section></main><script type="module">import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,getDoc,collection,getDocs,query,where,limit,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'},app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));await setPersistence(auth,browserLocalPersistence).catch(()=>{});let u,subjects=[],rows=[];const actionLabel=a=>({submitted:'Submitted',submitted_by_teacher:'Submitted',resubmitted_by_teacher:'Resubmitted after correction',returned_for_correction:'Returned for correction',verified_accepted:'Verified & accepted',teacher_corrected:'Corrected by teacher',edited_by_teacher:'Edited by teacher'}[a]||String(a||'Workflow event').replaceAll('_',' '));const fmt=t=>{const n=Number(t||0);return n?new Date(n).toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):''};function historyHtml(q){const w=Array.isArray(q.workflow)?q.workflow:[];if(!w.length)return '<div class="history small">No recorded revision events yet. This does not affect verification.</div>';return `<div class="history"><div class="small" style="margin-bottom:4px"><b>Revision trail · read only</b></div>${w.slice().sort((a,b)=>(Number(a.atMs)||0)-(Number(b.atMs)||0)).map(x=>`<div class="event"><b>${esc(actionLabel(x.action))}</b>${x.atMs?` <span class="small">· ${esc(fmt(x.atMs))}</span>`:''}${x.byName||x.byEmail?`<div class="small">By ${esc(x.byName||x.byEmail)}</div>`:''}${x.comment?`<div class="note small"><b>Coordinator note:</b> ${esc(x.comment)}</div>`:''}</div>`).join('')}</div>`}function render(){const term=$('search').value.trim().toLowerCase(),sub=$('subjectFilter').value;const shown=rows.filter(q=>(!sub||q.subject===sub)&&(!term||[q.questionText,q.teacherName,q.className,q.subject].join(' ').toLowerCase().includes(term)));$('status').innerHTML=`<div class="ok">${shown.length} pending question(s) shown · ${rows.length} loaded.</div>`;$('list').innerHTML=shown.length?shown.map(q=>`<div class="q"><b>${esc(q.questionText||'')}</b><div><span class="badge">${esc(q.className||'')}</span><span class="badge">${esc(q.subject||'')}</span><span class="badge">${esc(q.marks||0)} mark(s)</span></div><div class="small">Submitted by ${esc(q.teacherName||q.teacherEmail||'Teacher')}</div>${q.answer?`<div class="small" style="margin-top:7px"><b>Answer:</b> ${esc(q.answer)}</div>`:''}<div class="actions" style="margin-top:9px"><button class="green" data-accept="${esc(q.id)}">✓ Verify & Accept</button><button data-return="${esc(q.id)}">↩ Return for Correction</button><button data-history="${esc(q.id)}">🕘 Revision History${Array.isArray(q.workflow)&&q.workflow.length?` (${q.workflow.length})`:''}</button></div><div id="hist-${esc(q.id)}" style="display:none">${historyHtml(q)}</div></div>`).join(''):'<div class="tip">No pending questions in this view.</div>'}async function load(){try{$('status').textContent='Loading pending questions…';const s=await getDocs(query(collection(db,'qbQuestions'),where('status','==','submitted'),limit(250)));rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(q=>subjects.includes(String(q.subject||''))).sort((a,b)=>(Number(a.submittedAtMs||a.createdAtMs)||0)-(Number(b.submittedAtMs||b.createdAtMs)||0));render()}catch(e){$('status').innerHTML='<div class="warn">'+esc(e.message||e)+'</div>'}}async function boot(){u=auth.currentUser;if(!u)throw Error('Sign in through VKVTT first.');const a=await getDoc(doc(db,'qbCoordinatorAccess',u.uid));if(!a.exists()||a.data().active!==true)throw Error('No active Subject Coordinator assignment is linked to this account.');subjects=Object.entries(a.data().subjects||{}).filter(([,v])=>v===true).map(([k])=>k);if(!subjects.length)throw Error('No subjects are currently assigned to you for Question Bank verification.');$('gate').className='ok';$('gate').textContent='Coordinator access confirmed.';$('scope').innerHTML='<b>Your assigned subject'+(subjects.length>1?'s':'')+':</b> '+subjects.map(esc).join(' · ');$('subjectFilter').innerHTML='<option value="">All assigned subjects</option>'+subjects.map(s=>`<option>${esc(s)}</option>`).join('');$('work').style.display='block'}$('load').onclick=load;$('refresh').onclick=load;$('subjectFilter').onchange=render;$('search').oninput=render;$('list').onclick=async e=>{const h=e.target.closest('[data-history]');if(h){const box=document.getElementById('hist-'+h.dataset.history);if(box)box.style.display=box.style.display==='none'?'block':'none';return}const a=e.target.closest('[data-accept]'),r=e.target.closest('[data-return]');if(!a&&!r)return;const id=(a||r).dataset.accept||(a||r).dataset.return,q=rows.find(x=>x.id===id);if(!q||!subjects.includes(String(q.subject||'')))return alert('This question is outside your assigned subject scope.');try{if(a){if(!confirm('Verify and accept this question?'))return;const now=Date.now();await updateDoc(doc(db,'qbQuestions',id),{status:'approved',verifiedAtMs:now,verifiedAt:serverTimestamp(),verifiedByUid:u.uid,verifiedByEmail:u.email||'',verifiedByName:auth.currentUser.displayName||'',workflow:[...(Array.isArray(q.workflow)?q.workflow:[]),{action:'verified_accepted',atMs:now,byUid:u.uid,byName:auth.currentUser.displayName||''}]})}else{const note=prompt('Correction note for the teacher:');if(!note||note.trim().length<4)return;const now=Date.now();await updateDoc(doc(db,'qbQuestions',id),{status:'returned',returnComment:note.trim(),returnedAtMs:now,returnedByUid:u.uid,returnedByName:auth.currentUser.displayName||'',workflow:[...(Array.isArray(q.workflow)?q.workflow:[]),{action:'returned_for_correction',atMs:now,byUid:u.uid,byName:auth.currentUser.displayName||'',comment:note.trim()}]})}rows=rows.filter(x=>x.id!==id);render()}catch(err){alert('Could not update the question: '+(err.message||err))}};boot().catch(e=>{$('gate').className='warn';$('gate').textContent=e.message||e});</script></body></html>
