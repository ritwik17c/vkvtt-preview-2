<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VKVTT Preview 2 · Timetable Studio</title></head><body><div style="font:16px system-ui;padding:24px">Loading Timetable Studio…</div><script>(async()=>{try{
 const [hr,jr]=await Promise.all([
   fetch('https://raw.githubusercontent.com/ritwik17c/vkvtt-preview/main/timetable-studio.html?preview2=transfer1',{cache:'no-store'}),
   fetch('https://raw.githubusercontent.com/ritwik17c/vkvtt-preview/main/timetable-studio.js?preview2=transfer1',{cache:'no-store'})
 ]);
 let h=await hr.text(),j=await jr.text();
 h=h.replace('<head>','<head><base href="https://ritwik17c.github.io/vkvtt-preview/">');
 h=h.replaceAll('href="admin-dashboard.html?v=66.0"','href="https://ritwik17c.github.io/vkvtt-preview-2/admin-dashboard.html?v=preview2"');
 const panel=`<section class="surface" id="teacherTransferPanel" style="margin:0 0 16px;border:2px solid #a7c9dc"><div class="sectionTitle"><div><h3 style="margin:0">⇄ Transfer Teacher Timetable</h3><p>Move every current workspace period and allocation from one teacher to another in one action. The source teacher remains in the teacher list for historical identity.</p></div></div><div class="formGrid formGrid4"><div><label for="transferFromTeacher">From teacher</label><select id="transferFromTeacher"></select></div><div><label for="transferToTeacher">To teacher</label><select id="transferToTeacher"></select></div><div><label>Transfer summary</label><div id="transferTeacherSummary" class="notice" style="margin:0;padding:10px">Choose both teachers.</div></div><div class="formActions"><button id="transferTeacherBtn" type="button" class="button primary">Transfer All Periods</button></div></div></section>`;
 h=h.replace('<details class="componentSection" open>\n        <summary><span>Teachers</span>',panel+'<details class="componentSection" open>\n        <summary><span>Teachers</span>');
 const marker="$('newFromMaster').onclick=()=>openFreshWorkspace(true);";
 const patch=`\nfunction refreshTeacherTransfer(){const a=$('transferFromTeacher'),b=$('transferToTeacher'),s=$('transferTeacherSummary');if(!a||!b||!state.workspace)return;const teachers=state.workspace.teachers||[],oldA=a.value,oldB=b.value,opts='<option value="">Select…</option>'+teachers.map(t=>'<option value="'+safe(t.code)+'">'+safe(t.name)+' ('+safe(t.code)+')</option>').join('');a.innerHTML=opts;b.innerHTML=opts;if(teachers.some(t=>t.code===oldA))a.value=oldA;if(teachers.some(t=>t.code===oldB))b.value=oldB;const src=a.value,dst=b.value;if(!src||!dst||src===dst){s.textContent=src&&dst&&src===dst?'Choose two different teachers.':'Choose both teachers.';return}const rec=(state.workspace.records||[]).filter(r=>(r.teacherCodes||[]).includes(src));const al=(state.workspace.allocations||[]).filter(r=>(r.teacherCodes||[]).includes(src));const target=(state.workspace.records||[]).filter(r=>(r.teacherCodes||[]).includes(dst));let conflicts=0;for(const r of rec){if(target.some(x=>x.id!==r.id&&x.day===r.day&&Number(x.period)===Number(r.period)))conflicts++}s.innerHTML='<b>'+rec.length+'</b> timetable period(s) · <b>'+al.length+'</b> allocation card(s)'+(conflicts?' · <b>'+conflicts+'</b> possible target clash(es)':' · no direct target clashes found')}
function bindTeacherTransfer(){const a=$('transferFromTeacher'),b=$('transferToTeacher'),btn=$('transferTeacherBtn');if(!a||!b||!btn||btn.dataset.bound)return;btn.dataset.bound='1';a.onchange=refreshTeacherTransfer;b.onchange=refreshTeacherTransfer;btn.onclick=()=>{const src=a.value,dst=b.value;if(!src||!dst||src===dst){alert('Choose two different teachers.');return}const sw=state.workspace,rec=(sw.records||[]).filter(r=>(r.teacherCodes||[]).includes(src)),al=(sw.allocations||[]).filter(r=>(r.teacherCodes||[]).includes(src));const target=(sw.records||[]).filter(r=>(r.teacherCodes||[]).includes(dst));let conflicts=0;for(const r of rec){if(target.some(x=>x.id!==r.id&&x.day===r.day&&Number(x.period)===Number(r.period)))conflicts++}const fromName=sw.teachers.find(t=>t.code===src)?.name||src,toName=sw.teachers.find(t=>t.code===dst)?.name||dst;const warning=conflicts?'\\n\\nWarning: '+conflicts+' possible timetable clash(es) for the receiving teacher. Validate before activation.':'';if(!confirm('Transfer all '+rec.length+' timetable periods and '+al.length+' allocation cards from '+fromName+' to '+toName+'?'+warning+'\\n\\nThe source teacher will remain in the teacher list.'))return;const repl=codes=>[...new Set((codes||[]).map(c=>c===src?dst:c))];for(const r of sw.records||[])r.teacherCodes=repl(r.teacherCodes);for(const r of sw.allocations||[])r.teacherCodes=repl(r.teacherCodes);for(const r of sw.unplaced||[])if(Array.isArray(r.teacherCodes))r.teacherCodes=repl(r.teacherCodes);markDirty('Teacher timetable transferred');renderAll();refreshTeacherTransfer();alert('Transfer complete in this workspace. Save, validate and activate the new timetable version when ready.')};refreshTeacherTransfer()}
setInterval(()=>{bindTeacherTransfer();refreshTeacherTransfer()},1500);\n`;
 if(j.includes(marker))j=j.replace(marker,marker+patch);else throw new Error('Could not locate Timetable Studio insertion point.');
 const blob=URL.createObjectURL(new Blob([j],{type:'text/javascript'}));
 h=h.replace(/<script type="module" src="timetable-studio\.js[^\"]*"><\\\/script>|<script type="module" src="timetable-studio\.js[^\"]*"><\/script>/,'<script type="module" src="'+blob+'"><\/script>');
 document.open();document.write(h);document.close();
}catch(e){document.body.innerHTML='<p style="padding:24px;font:16px system-ui">Could not load Preview 2 Timetable Studio: '+String(e)+'</p>'}})();</script></body></html>
