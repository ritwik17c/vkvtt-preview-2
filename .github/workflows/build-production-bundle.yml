name: Build minimal production bundle

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-production-bundle.yml']

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch read-only Preview1 source
        run: git clone --depth 1 https://github.com/ritwik17c/vkvtt-preview.git /tmp/vkvtt-preview
      - name: Assemble exact production bundle
        shell: python
        run: |
          from pathlib import Path
          import os, re, shutil, urllib.parse

          p2=Path('.').resolve()
          p1=Path('/tmp/vkvtt-preview').resolve()

          # Preview2 pages which were only wrappers around Preview1. Replace them
          # with their proven source so Production has no Preview1 runtime dependency.
          replace_from_p1={
            'attendance.html',
            'admin-attendance.html',
            'annual-calendar-2026-27.html',
            'admin-dashboard.html',
            'admin-staff-management.html',
            'admin-staff-notice-board.html',
            'admin-timetable-studio.html',
            'admin-question-bank-v2.html',
          }
          for rel in sorted(replace_from_p1):
            src=p1/rel
            if not src.exists():
              raise SystemExit(f'Missing required Preview1 source: {rel}')
            shutil.copy2(src,p2/rel)

          # Required administrative pages that Preview2 previously reached through
          # Preview1's base URL or inherited dashboard.
          copy_required_from_p1={
            'admin-account-staff-link.html',
            'admin-annual-calendar.html',
            'admin-attendance-tests.html',
            'admin-biometric-import.html',
            'admin-import.html',
            'admin-leave-import.html',
            'admin-leave-rules.html',
            'admin-schedules.html',
            'admin-timetable-integrity.html',
            'admin-users.html',
          }
          for rel in sorted(copy_required_from_p1):
            shutil.copy2(p1/rel,p2/rel)

          # Local copy of the proven Preview1 operational shell is retained only as
          # the engine behind the Proxy Manager iframe. It is not a user entry page.
          shutil.copy2(p1/'index.html',p2/'proxy-manager-core.html')
          proxy=p2/'proxy-manager.html'
          t=proxy.read_text(encoding='utf-8')
          t=re.sub(r'https://ritwik17c\.github\.io/vkvtt-preview/\?proxy-manager=1','./proxy-manager-core.html?proxy-manager=1',t)
          proxy.write_text(t,encoding='utf-8')

          # Disable PWA registration/manifest inside the iframe-only proxy core so it
          # cannot control the Production root service worker scope.
          core=p2/'proxy-manager-core.html'
          t=core.read_text(encoding='utf-8')
          t=re.sub(r'<link[^>]+rel=["\']manifest["\'][^>]*>','',t,flags=re.I)
          t=re.sub(r'navigator\.serviceWorker\.register\([^;]+;?','void 0',t)
          core.write_text(t,encoding='utf-8')

          # Preserve the newer Preview2 Admin Dashboard grouping and teacher tools
          # on top of the proven standalone dashboard.
          dash=p2/'admin-dashboard.html'
          t=dash.read_text(encoding='utf-8')
          inject='''\n<script src="vkv-route-policy.js?v=prod"></script>\n<script src="vkv-admin-dashboard-runtime.js?v=prod"></script>\n<script src="vkv-dashboard-metrics-final.js?v=prod"></script>\n<script src="vkv-teacher-transfer.js?v=prod"></script>\n<script src="vkv-teacher-shortcode-rename.js?v=prod"></script>\n'''
          if 'vkv-admin-dashboard-runtime.js' not in t:
            t=t.replace('</body>',inject+'</body>')
          dash.write_text(t,encoding='utf-8')

          # Preserve Preview2 Question Bank master-derived options/coordinator fixes
          # while making the page itself standalone.
          qb=p2/'admin-question-bank-v2.html'
          t=qb.read_text(encoding='utf-8')
          old='<div class="actions"><button id="saveSettings" class="primary">Save Settings</button><button id="downloadImportTemplate">Download Import Template</button></div>'
          new='<div class="actions"><button id="saveSettings" class="primary">Save Settings</button><button id="downloadImportTemplate">Download Import Template</button><a class="btn" href="admin-qb-import.html?v=66.0">📥 Import Existing Excel / Google Sheet</a></div>'
          if old in t:
            t=t.replace(old,new)
          qbinject='''\n<script type="module" src="vkv-qb-master-options.js?v=prod"></script>\n<script type="module" src="vkv-qb-admin-coordinator-fix.js?v=prod"></script>\n'''
          if 'vkv-qb-master-options.js' not in t:
            t=t.replace('</body>',qbinject+'</body>')
          qb.write_text(t,encoding='utf-8')

          # Shared visual assets become local files. No production page is allowed
          # to depend on Preview1 for branding.
          for rel in ['icon-192.png','Swami Vivekananda.png','school-logo.jpg']:
            shutil.copy2(p1/rel,p2/rel)

          # Intentional Production entry pages / maintenance pages. Everything else
          # must be reached as a local non-HTML dependency of one of these roots.
          roots={
            'index.html','attendance.html','my-leave.html','annual-calendar-2026-27.html',
            'proxy-history.html','proxy-manager.html','proxy-manager-core.html',
            'teacher-special-duty.html','office-duty-schedule.html',
            'qb-module.html','qb-module-v2.html','QB_TEACHER_GUIDE.html',
            'leave-manager.html','leave-manager-entry.html','leave-manager-approvals.html',
            'admin-leave-editor.html','leave-data-audit.html','super-leave-filter.html',
            'admin-dashboard.html','admin-attendance.html','admin-attendance-tests.html',
            'admin-biometric-import.html','admin-annual-calendar.html','admin-schedules.html',
            'admin-timetable-integrity.html','admin-leave-rules.html','admin-users.html',
            'admin-account-staff-link.html','admin-import.html','admin-leave-import.html',
            'admin-leave.html','admin-export.html','admin-timetable-studio.html',
            'admin-staff-management.html','admin-classes-manager.html','admin-master-overview.html',
            'admin-office-duty-scheduler.html','admin-teacher-special-duty-scheduler.html',
            'admin-staff-notice-board.html','admin-question-bank-v2.html','admin-qb-import.html',
            'admin-print-master.html'
          }

          # Make all app-owned URLs deployable at any repository root. Firebase/CDN
          # imports remain external by design.
          text_ext={'.html','.js','.css','.webmanifest','.svg','.txt'}
          replacements=[
            ('https://ritwik17c.github.io/vkvtt-preview-2/','./'),
            ('https://ritwik17c.github.io/vkvtt-preview/','./'),
            ('https://raw.githubusercontent.com/ritwik17c/vkvtt-preview/main/','./'),
          ]
          for f in list(p2.rglob('*')):
            if not f.is_file() or '.git' in f.parts or f.suffix.lower() not in text_ext:
              continue
            try: s=f.read_text(encoding='utf-8')
            except Exception: continue
            for a,b in replacements: s=s.replace(a,b)
            if f.suffix.lower()=='.html':
              s=s.replace('Preview 2','Production').replace('Preview2','Production')
            f.write_text(s,encoding='utf-8')

          # Explicitly keep the three local branding assets even if a browser decodes
          # an encoded path before requesting them.
          keep=set(roots)|{'icon-192.png','Swami Vivekananda.png','school-logo.jpg'}

          # Dependency closure for non-HTML runtime assets. HTML navigation is kept
          # deliberately explicit above so old/hidden routes cannot drag obsolete pages
          # back into the bundle.
          dep_re=re.compile(r'''(?<![A-Za-z0-9_-])([A-Za-z0-9_./%+\- ]+\.(?:js|css|png|jpe?g|svg|webmanifest))(?:\?[^\s"'<>)]*)?''',re.I)
          q=list(keep)
          seen=set()
          while q:
            rel=q.pop()
            if rel in seen: continue
            seen.add(rel)
            f=p2/rel
            if not f.exists():
              src=p1/rel
              if src.exists():
                f.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,f)
              else:
                raise SystemExit(f'Required root/dependency is missing: {rel}')
            if f.suffix.lower() not in text_ext: continue
            try: s=f.read_text(encoding='utf-8')
            except Exception: continue
            for m in dep_re.finditer(s):
              dep=urllib.parse.unquote(m.group(1)).lstrip('./')
              if '://' in dep or dep.startswith('data:') or dep.startswith('/') or '..' in Path(dep).parts:
                continue
              dep=str(Path(dep)).replace('\\','/')
              if dep in keep: continue
              if (p2/dep).exists() or (p1/dep).exists():
                if not (p2/dep).exists():
                  (p2/dep).parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p1/dep,p2/dep)
                  # Localise newly copied text immediately.
                  if (p2/dep).suffix.lower() in text_ext:
                    try:
                      x=(p2/dep).read_text(encoding='utf-8')
                      for a,b in replacements: x=x.replace(a,b)
                      (p2/dep).write_text(x,encoding='utf-8')
                    except Exception: pass
                keep.add(dep); q.append(dep)

          # Prune everything not proven necessary. The one-time workflow deletes itself.
          for f in sorted(p2.rglob('*'),key=lambda x:len(x.parts),reverse=True):
            if '.git' in f.parts: continue
            rel=f.relative_to(p2).as_posix()
            if f.is_file() and rel not in keep:
              f.unlink()
          for d in sorted([x for x in p2.rglob('*') if x.is_dir() and '.git' not in x.parts],key=lambda x:len(x.parts),reverse=True):
            try: d.rmdir()
            except OSError: pass

          # Hard production gate: no Preview1/Preview2 runtime host dependencies.
          bad=[]
          for f in p2.rglob('*'):
            if not f.is_file() or '.git' in f.parts or f.suffix.lower() not in text_ext: continue
            try: s=f.read_text(encoding='utf-8')
            except Exception: continue
            if 'ritwik17c.github.io/vkvtt-preview' in s or 'raw.githubusercontent.com/ritwik17c/vkvtt-preview' in s:
              bad.append(f.relative_to(p2).as_posix())
          if bad:
            raise SystemExit('Preview runtime dependency remains in: '+', '.join(bad))

          print('Final production bundle file count:',sum(1 for f in p2.rglob('*') if f.is_file() and '.git' not in f.parts))
          print('Final files:')
          for f in sorted(p2.rglob('*')):
            if f.is_file() and '.git' not in f.parts: print(' -',f.relative_to(p2).as_posix())
      - name: Commit minimal bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare minimal self-contained production bundle" || exit 0
          git push origin main
