name: One-time sync from production

on:
  push:
    paths:
      - '.github/workflows/one-time-sync-from-production.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview-2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone production main
        run: |
          git clone --depth 1 --branch main https://github.com/ritwik17c/vkvtt.git /tmp/vkvtt-production

      - name: Mirror production into Preview-2
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/one-time-sync-from-production.yml' \
            /tmp/vkvtt-production/ ./

      - name: Commit synchronized snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Preview-2 already matches production main.'
          else
            git commit -m 'Sync Preview-2 with current production main'
            git push origin HEAD:main
          fi
