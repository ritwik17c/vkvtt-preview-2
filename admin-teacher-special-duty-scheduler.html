<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher's Special Duty Scheduler · VKV Nalbari</title><style>body{margin:0;background:#edf6f1;font-family:system-ui,Segoe UI,Arial;color:#24394b}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #cadbe4;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 16px #17324d10}h1,h2{color:#17364f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{display:block;font-size:.82rem;color:#667987;margin:8px 0 5px}input,select{width:100%;padding:10px;border:1px solid #c7d5de;border-radius:10px;background:#fbfefd;font:inherit}button,a.btn{font:inherit;font-weight:750;border:1px solid #b9ced9;border-radius:11px;padding:10px 13px;background:#e7f2f7;color:#17364f;cursor:pointer;text-decoration:none}.primary{background:#236d99;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;padding:10px 0;border-top:1px solid #e4ecef}.status{padding:10px 12px;border-radius:10px;background:#eef7fb;margin-top:10px}@media(max-width:760px){.grid,.row{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="actions"><a class="btn" href="admin-dashboard.html">← Admin Dashboard</a></div><div class="card"><h1>🎯 Teacher's Special Duty Scheduler</h1><div>Assign special duties without altering the Master Timetable.</div></div><div class="card"><h2>Add Special Duty</h2><div class="grid"><div><label>Day / Date</label><input id="when" placeholder="e.g. Monday or 05/09/2026"></div><div><label>Period / Time Slot</label><input id="slot" placeholder="e.g. P1–P2 or 8:00–9:00"></div><div><label>Teacher</label><select id="staff"></select></div><div><label>Duty / Venue</label><input id="duty" placeholder="Assembly / Exam / Gate / Hall..."></div></div><div class="actions"><button id="add" class="primary">Add Duty</button></div><div id="msg" class="status" style="display:none"></div></div><div class="card"><h2>Current Special Duties</h2><div id="list">Loading…</div></div></div><script type="module">import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,updateDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-lite.js';const cfg={apiKey:'AIzaSyDheZpyXghd1aQ9_RLhwpacVriG__wNZW4',authDomain:'vkv-nalbari-timetable.firebaseapp.com',projectId:'vkv-nalbari-timetable',storageBucket:'vkv-nalbari-timetable.firebasestorage.app',messagingSenderId:'791432856951',appId:'1:791432856951:web:61324065a54bef30f98d72'},app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let M={},wrapped=true,rows=[];const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const s=await getDoc(doc(db,'master','current')),raw=s.data()||{};wrapped=!!raw.data;M=raw.data||raw;rows=Array.isArray(M.teacherSpecialDutySchedule)?M.teacherSpecialDutySchedule:[];const t=(M.teachers||[]).filter(x=>x&&x.active!==false);$('staff').innerHTML=t.map(x=>`<option value="${safe(x.code||'')}">${safe(x.name||'')} (${safe(x.code||'')})</option>`).join('');render()}async function persist(){const ref=doc(db,'master','current');if(wrapped)await updateDoc(ref,{'data.teacherSpecialDutySchedule':rows,'data.teacherSpecialDutyScheduleUpdatedAtMs':Date.now()});else await setDoc(ref,{teacherSpecialDutySchedule:rows,teacherSpecialDutyScheduleUpdatedAtMs:Date.now()},{merge:true})}function render(){$('list').innerHTML=rows.length?rows.map((r,i)=>`<div class="row"><div><b>${safe(r.when)}</b></div><div>${safe(r.slot)}</div><div>${safe(r.staffName||r.staffCode)}</div><div>${safe(r.duty||'')}</div><button data-del="${i}">Delete</button></div>`).join(''):'No special duties assigned yet.'}$('add').onclick=async()=>{const code=$('staff').value,t=(M.teachers||[]).find(x=>String(x.code||'')===code);rows.push({id:'TSD_'+Date.now(),when:$('when').value.trim(),slot:$('slot').value.trim(),staffCode:code,staffName:t?.name||code,duty:$('duty').value.trim(),active:true,updatedAtMs:Date.now()});await persist();render();$('msg').style.display='block';$('msg').textContent='Teacher special duty saved.'};document.addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(!b)return;rows.splice(+b.dataset.del,1);await persist();render()});onAuthStateChanged(auth,async u=>{if(!u)return alert('Sign in with Admin account first.');const p=await getDoc(doc(db,'authorizedUsers',u.uid));if(!p.exists()||p.data().active!==true||p.data().role!=='admin')return alert('Admin access required.');load()});</script></body></html>
